name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21

          server-dir: /htdocs/
          local-dir: ./

          # Bump this value to force a full re-sync of every file.
          # (Safe: it never deletes server-only files like app-api/.)
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/scripts/**
            node_modules/**
            package.json
            package-lock.json
            .env
            .env.*
            app-api/**
